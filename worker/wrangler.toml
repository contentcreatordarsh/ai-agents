name = "se-stand-deliver-secure"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Replace with your account ID: wrangler whoami
# account_id = ""

# Route is attached after deploy; example for tunnel.example.com:
# [[routes]]
# pattern = "tunnel.example.com/secure*"
# zone_name = "example.com"

[[r2_buckets]]
binding = "FLAGS"
bucket_name = "se-country-flags"
preview_bucket_name = "se-country-flags-preview"

[vars]
# Public hostname used in HTML links (no trailing slash)
PUBLIC_HOST = "tunnel.example.com"
